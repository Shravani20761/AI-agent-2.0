server {
    listen 4321;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend service (Docker internal DNS)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy LiveKit WebSocket signaling through the same HTTPS origin.
    # Browser connects to wss://demo.qdeploy.online/livekit-ws/rtc/v1?...
    # nginx strips the /livekit-ws prefix and forwards to livekit:7880.
    # This avoids mixed-content (ws:// from https://) with no extra domain.
    location /livekit-ws/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React SPA — all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck endpoint for docker compose depends_on
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Disable directory listing
    autoindex off;
}
