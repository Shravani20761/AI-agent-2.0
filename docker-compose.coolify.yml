name: charges-calculator

networks:
  charges-net:
    driver: bridge

services:

  # ── LiveKit Server ─────────────────────────────────────────
  # Built from Dockerfile.livekit which COPYs livekit.yaml into the image.
  # No volume mount — Coolify bind-mounts resolve on the VPS host, not
  # inside the build container where the source file actually lives.
  livekit:
    build:
      context: ./infra/charges-calculator
      dockerfile: Dockerfile.livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - charges-net

  # ── Backend (Express + Prisma + MCP) ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.charges-calculator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      LIVEKIT_URL: ws://livekit:7880
    depends_on:
      - livekit
    networks:
      - charges-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── AI Voice Agent ─────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile.charges-calculator
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://livekit:7880
      DEMO_BACKEND_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - charges-net

  # ── Cost Dashboard (React SPA + Nginx) ────────────────────
  cost-ui:
    build:
      context: ./cost-dashboard
      dockerfile: Dockerfile.charges-calculator
    restart: unless-stopped
    ports:
      - "4321:80"
    depends_on:
      - backend
    networks:
      - charges-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3
