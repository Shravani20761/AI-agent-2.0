# Self-hosted LiveKit — charges-calculator testing stack
# Keys below MUST match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in Coolify env vars.
# TLS is handled by Coolify/Traefik — LiveKit stays plain HTTP internally.

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Advertises the VPS public IP in WebRTC ICE candidates.
  # Without this, Docker internal IPs are advertised and browser audio fails.
  use_external_ip: true
  enable_loopback_candidate: false

keys:
  cc-dev-key: cc-dev-secret-testing-only-not-for-production

logging:
  level: info
  pion_level: error
