name: charges-calculator

networks:
  charges-net:
    driver: bridge

services:

  # ── LiveKit Server ─────────────────────────────────────────
  # Coolify/Traefik routes WSS to this service via the domain you set in UI.
  # 7881 TCP + 7882 UDP are bound directly — Traefik cannot proxy UDP.
  livekit:
    image: livekit/livekit-server:latest
    container_name: cc-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - charges-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Express + Prisma + MCP) ──────────────────────
  # All secrets injected by Coolify env vars — no env_file.
  # LIVEKIT_URL here is the internal Docker address (agent SDK + token signing).
  # The external WSS URL comes from the LIVEKIT_URL Coolify env var,
  # which the backend reads when building tokens returned to the browser.
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.charges-calculator
    container_name: cc-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      LIVEKIT_URL: ws://cc-livekit:7880
    depends_on:
      livekit:
        condition: service_healthy
    networks:
      - charges-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── AI Voice Agent ─────────────────────────────────────────
  agent:
    build:
      context: ../../agent
      dockerfile: Dockerfile.charges-calculator
    container_name: cc-agent
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://cc-livekit:7880
      DEMO_BACKEND_URL: http://cc-backend:3001
    depends_on:
      livekit:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - charges-net

  # ── Cost Dashboard (React SPA + Nginx) ────────────────────
  # Coolify routes your domain to this service automatically.
  cost-ui:
    build:
      context: ../../cost-dashboard
      dockerfile: Dockerfile.charges-calculator
    container_name: cc-cost-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - charges-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 3
