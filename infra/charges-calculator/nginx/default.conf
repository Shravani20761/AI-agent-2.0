# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    server_name REPLACE_WITH_YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# ── HTTPS: cost dashboard + backend API ──────────────────────
server {
    listen 443 ssl;
    server_name REPLACE_WITH_YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Backend API
    location /api/ {
        proxy_pass         http://cc-backend:3001/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MCP endpoint (agent calls this during demo calls)
    location /mcp {
        proxy_pass            http://cc-backend:3001/mcp;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "upgrade";
        proxy_set_header      Host       $host;
        proxy_read_timeout    300s;
    }

    # Cost dashboard — everything else goes to the React SPA
    location / {
        proxy_pass       http://cc-cost-ui:80;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Port 7880 TLS: LiveKit WebSocket ─────────────────────────
# Browser connects to wss://REPLACE_WITH_YOUR_DOMAIN:7880
# Nginx terminates TLS and forwards plain WS to LiveKit internally.
# LiveKit UDP (7882) and TCP (7881) bypass Nginx entirely — they are
# bound directly to the host for WebRTC media.
server {
    listen 7880 ssl;
    server_name REPLACE_WITH_YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass          http://cc-livekit:7880;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;     # keep WebSocket alive for long calls
    }
}
